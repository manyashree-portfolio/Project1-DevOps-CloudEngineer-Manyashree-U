apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: novapay-baseline-pod-security
  annotations:
    novapay/regulatory-refs: "RBI 4.2, 5.4; PCI-DSS 6.5"
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-privileged
      match:
        any:
          - resources: { kinds: [Pod] }
      validate:
        message: "Privileged containers are not allowed."
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(privileged): "false"
    - name: disallow-latest-tag
      match:
        any:
          - resources: { kinds: [Pod] }
      validate:
        message: "Images must use a version tag or digest, never ':latest'."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
