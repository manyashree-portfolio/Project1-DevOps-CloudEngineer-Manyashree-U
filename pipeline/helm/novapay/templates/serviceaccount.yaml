apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "novapay.fullname" . }}
  labels:
    {{- include "novapay.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
automountServiceAccountToken: false
